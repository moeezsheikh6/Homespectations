name: Paint diagnostics
on:
  push:
    branches: [claude/project-thread-tdv1sk]
    paths: [diag/fcp.js, diag/run.txt]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node diag/fcp.js "$(cat diag/run.txt 2>/dev/null || echo https://homespectations.pk/collections/beds)"
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add diag/fcp.csv
          git commit -m "Paint diagnostics" || exit 0
          git pull --rebase && git push
