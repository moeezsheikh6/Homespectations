name: Fetch shop images
on:
  push:
    branches: [claude/project-thread-5lq2bu]
    paths: [ads-1111/urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images (resized to 1200px wide)
        run: |
          mkdir -p ads-1111/src
          while read -r name url w; do
            [ -z "$name" ] && continue
            sep='?'; case "$url" in *\?*) sep='&';; esac
            if [ "$w" = "0" ]; then u="$url"; else u="${url}${sep}width=${w:-1600}"; fi
            curl -sSfL "$u" -o "ads-1111/src/$name" || echo "failed $name"
          done < ads-1111/urls.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ads-1111/src
          git commit -m "Cache product photos for 11.11 ads" || exit 0
          git push
