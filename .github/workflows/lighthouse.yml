name: Lighthouse
on:
  push:
    branches: [claude/project-thread-tdv1sk]
    paths: [lighthouse/request.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Run Lighthouse (mobile, several runs per page, keep median)
        env:
          RUNS: 5
        run: |
          stamp=$(date -u +%Y%m%d-%H%M)
          dir=lighthouse/results/$stamp; mkdir -p $dir
          while read -r name url; do
            case "$name" in ""|\#*) continue;; esac
            for i in $(seq 1 ${RUNS:-3}); do
              npx -y lighthouse@12.8.2 "$url" --only-categories=performance --output=json --output-path=$dir/$name-$i.json \
                --chrome-flags="--headless=new --no-sandbox" --quiet || true
            done
            node lighthouse/median.js $dir $name $RUNS
            node lighthouse/summarize.js $dir/$name.json > $dir/$name-summary.json
          done < lighthouse/request.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add lighthouse/results
          git commit -m "Lighthouse results" || exit 0
          git pull --rebase && git push
