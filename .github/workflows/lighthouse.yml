name: Lighthouse
on:
  push:
    branches: [claude/project-thread-tdv1sk]
    paths: [lighthouse/request.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Run Lighthouse (mobile, 3 runs per page, keep median)
        run: |
          stamp=$(date -u +%Y%m%d-%H%M)
          dir=lighthouse/results/$stamp; mkdir -p $dir
          while read -r name url; do
            [ -z "$name" ] && continue
            for i in 1 2 3; do
              npx -y lighthouse@12.2.1 "$url" --only-categories=performance --output=json --output-path=$dir/$name-$i.json \
                --chrome-flags="--headless=new --no-sandbox" --quiet || true
            done
            node -e '
              const fs=require("fs");const [d,n]=process.argv.slice(1);
              const runs=[1,2,3].map(i=>`${d}/${n}-${i}.json`).filter(f=>fs.existsSync(f)).map(f=>[f,JSON.parse(fs.readFileSync(f)).categories.performance.score]);
              runs.sort((a,b)=>a[1]-b[1]); const med=runs[Math.floor(runs.length/2)][0];
              fs.copyFileSync(med,`${d}/${n}.json`); runs.forEach(r=>fs.unlinkSync(r[0])); console.log(n, runs.map(r=>r[1]));
            ' $dir $name
            node lighthouse/summarize.js $dir/$name.json > $dir/$name-summary.json
          done < lighthouse/request.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add lighthouse/results
          git commit -m "Lighthouse results" || exit 0
          git pull --rebase && git push
