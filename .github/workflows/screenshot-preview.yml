name: Screenshot theme preview
on:
  push:
    branches: [claude/project-thread-r22ri7]
    paths: [screenshots/request.txt]
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Take screenshots
        run: |
          cat > shoot.js <<'JS'
          const { chromium, devices } = require('playwright');
          const fs = require('fs');
          (async () => {
            const lines = fs.readFileSync('screenshots/request.txt','utf8').trim().split('\n');
            const browser = await chromium.launch();
            for (const line of lines) {
              const [name, url, kind] = line.trim().split(/\s+/);
              const ctx = kind === 'mobile'
                ? await browser.newContext({ ...devices['iPhone 13'] })
                : await browser.newContext({ viewport: { width: 1440, height: 900 } });
              const page = await ctx.newPage();
              await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 }).catch(e => console.log(e.message));
              await page.waitForTimeout(4000);
              // close popups if any
              await page.keyboard.press('Escape').catch(()=>{});
              for (let y = 0; y < 20000; y += 600) { await page.evaluate(v => window.scrollTo(0, v), y); await page.waitForTimeout(250); }
              await page.evaluate(() => window.scrollTo(0, 0)); await page.waitForTimeout(1500);
              await page.screenshot({ path: `screenshots/${name}-fold.png` });
              await page.screenshot({ path: `screenshots/${name}-full.png`, fullPage: true });
              await ctx.close();
            }
            await browser.close();
          })();
          JS
          node shoot.js
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add screenshots/*.png
          git commit -m "Theme preview screenshots" || exit 0
          git push
